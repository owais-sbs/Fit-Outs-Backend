<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<table th:fragment="wrapper (content)" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
             style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,0.08);">
        <tr>
          <td style="background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);padding:28px 32px;">
            <p style="margin:0;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:0.3px;">OnePath Solutions</p>
            <p style="margin:6px 0 0;font-size:13px;color:#cbd5e1;">Fit-Outs platform</p>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;" th:insert="${content}">Content</td>
        </tr>
        <tr>
          <td style="padding:20px 32px 28px;border-top:1px solid #e2e8f0;background-color:#f8fafc;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#64748b;">
              This message was sent by OnePath Solutions Fit-Outs.<br/>
              Please do not reply directly to this automated email.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<a th:fragment="button (href, label)"
   th:href="${href}"
   th:text="${label}"
   style="display:inline-block;margin-top:8px;padding:12px 24px;background-color:#2563eb;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;border-radius:6px;">
  Button
</a>
</body>
</html>
