<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<table th:replace="~{fragments :: wrapper(~{::main})}">
  <div th:fragment="main">
      <h1 style="margin:0 0 20px;font-size:20px;line-height:1.4;color:#0f172a;font-weight:700;">Quotation</h1>
      <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#334155;">Hello,</p>
      <p style="margin:0 0 8px;font-size:14px;color:#64748b;">Reference</p>
      <p style="margin:0 0 20px;font-size:16px;font-weight:600;color:#0f172a;" th:text="${quoteNo}">Q-001</p>

      <div th:each="line : ${messageLines}"
           style="margin:0 0 4px;font-size:15px;line-height:1.6;color:#334155;"
           th:text="${line}">Message line</div>

      <p style="margin:24px 0 0;font-size:14px;line-height:1.6;color:#64748b;">
        Please find the quotation attached as a PDF.
      </p>
  </div>
</table>
</body>
</html>
