<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<table th:replace="~{fragments :: wrapper(~{::main})}">
  <div th:fragment="main">
      <h1 style="margin:0 0 20px;font-size:20px;line-height:1.4;color:#0f172a;font-weight:700;">Reset your password</h1>
      <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#334155;">
        Hello <strong th:text="${clientName}">there</strong>,
      </p>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#334155;">
        We received a request to reset the password for your account.
        Click the button below to choose a new password.
        If you did not request this, you can ignore this email.
      </p>

      <a th:replace="~{fragments :: button(${resetUrl}, 'Reset password')}"></a>

      <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#64748b;">
        This link expires in 30 minutes and can only be used once. After resetting, sign in at
        <a th:href="${loginUrl}" th:text="${loginUrl}" style="color:#2563eb;">login</a>.
      </p>
  </div>
</table>
</body>
</html>
