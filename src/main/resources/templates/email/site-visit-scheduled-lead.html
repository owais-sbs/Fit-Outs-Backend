<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<table th:replace="~{fragments :: wrapper(~{::main})}">
  <div th:fragment="main">
      <h1 style="margin:0 0 20px;font-size:20px;line-height:1.4;color:#0f172a;font-weight:700;">Site visit scheduled</h1>
      <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#334155;">
        Hello <strong th:text="${clientName}">there</strong>,
      </p>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#334155;">
        Your site visit has been scheduled for
        <strong th:text="${schedule}">date</strong>.
      </p>

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
             style="margin:0 0 20px;background-color:#f8fafc;border-radius:6px;border:1px solid #e2e8f0;">
        <tr>
          <td style="padding:16px 20px;">
            <p style="margin:0 0 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#64748b;">Assigned team</p>
            <p style="margin:0;font-size:15px;color:#0f172a;" th:text="${staffNames}">Team</p>
          </td>
        </tr>
      </table>

      <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#64748b;">
        Location details will follow once confirmed.
      </p>

      <a th:replace="~{fragments :: button(${visitUrl}, 'View site visit')}"></a>
  </div>
</table>
</body>
</html>
