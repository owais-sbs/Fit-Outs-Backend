<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<table th:replace="~{fragments :: wrapper(~{::main})}">
  <div th:fragment="main">
      <h1 style="margin:0 0 20px;font-size:20px;line-height:1.4;color:#0f172a;font-weight:700;">Payment reminder</h1>
      <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#334155;">
        Hello <strong th:text="${clientName}">there</strong>,
      </p>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#334155;">
        A payment has been requested for your project
        <strong th:text="${projectName}">project</strong>.
      </p>

      <p style="margin:0 0 8px;font-size:14px;color:#64748b;">Milestone</p>
      <p style="margin:0 0 16px;font-size:16px;font-weight:600;color:#0f172a;" th:text="${milestoneName}">Milestone</p>

      <p style="margin:0 0 8px;font-size:14px;color:#64748b;">Amount due</p>
      <p style="margin:0 0 16px;font-size:16px;font-weight:600;color:#0f172a;" th:text="${amount}">AED 0.00</p>

      <p style="margin:0 0 8px;font-size:14px;color:#64748b;">Due date</p>
      <p style="margin:0 0 24px;font-size:16px;font-weight:600;color:#0f172a;" th:text="${dueDate}">—</p>

      <a th:replace="~{fragments :: button(${invoicesUrl}, 'View invoices')}"></a>

      <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#64748b;">
        If you have questions about this request, please contact your project team.
      </p>
  </div>
</table>
</body>
</html>
