spring.application.name=fitouts

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.database-platform=${SPRING_JPA_HIBERNATE_DIALECT}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080
server.address=0.0.0.0
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=FITOUTS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=none

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.tomcat.max-swallow-size=-1

spring.session.jdbc.initialize-schema=always

app.auth.allowed-origins=${APP_AUTH_ALLOWED_ORIGINS:http://localhost:3000}
app.auth.session-cookie-name=${APP_AUTH_SESSION_COOKIE_NAME:FITOUTS_SESSION}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.device-cookie-name=${APP_AUTH_DEVICE_COOKIE_NAME:FITOUTS_DEVICE}
app.auth.device-cookie-max-age-days=${APP_AUTH_DEVICE_COOKIE_MAX_AGE_DAYS:30}
app.auth.otp.expiry-minutes=${APP_AUTH_OTP_EXPIRY_MINUTES:5}
app.auth.otp.max-attempts=${APP_AUTH_OTP_MAX_ATTEMPTS:5}
app.auth.otp.super-admin-enabled=${APP_AUTH_OTP_SUPER_ADMIN_ENABLED:true}
app.auth.otp.dev-bypass-enabled=${APP_AUTH_OTP_DEV_BYPASS_ENABLED:false}
app.auth.otp.dev-expose-value=${APP_AUTH_OTP_DEV_EXPOSE_VALUE:false}
