spring.application.name=fitouts

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.database-platform=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080
server.address=0.0.0.0
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=FITOUTS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:lax}

spring.session.timeout=60m
spring.session.servlet.cookie.name=${APP_AUTH_SESSION_COOKIE_NAME:FITOUTS_SESSION}
spring.session.servlet.cookie.http-only=true
spring.session.servlet.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
spring.session.servlet.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:lax}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

fitouts.upload.dir=${FITOUTS_UPLOAD_DIR:uploads}
fitouts.dwg.converter.path=${FITOUTS_DWG_CONVERTER_PATH:}

fitouts.gemini.api-key=${GEMINI_API_KEY:}
fitouts.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.tomcat.max-swallow-size=-1
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=/opt/ssl/keystore.p12
server.ssl.key-store-password=fkajfawjnafdfdsfs
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=jct

spring.session.jdbc.initialize-schema=always

app.auth.allowed-origins=${APP_AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,https://fitouts.onepathsolutions.com}
app.auth.session-cookie-name=${APP_AUTH_SESSION_COOKIE_NAME:FITOUTS_SESSION}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${APP_AUTH_COOKIE_SAME_SITE:}
app.auth.device-cookie-name=${APP_AUTH_DEVICE_COOKIE_NAME:FITOUTS_DEVICE}
app.auth.device-cookie-max-age-days=${APP_AUTH_DEVICE_COOKIE_MAX_AGE_DAYS:30}
app.auth.otp.expiry-minutes=${APP_AUTH_OTP_EXPIRY_MINUTES:5}
app.auth.otp.max-attempts=${APP_AUTH_OTP_MAX_ATTEMPTS:5}
app.auth.otp.super-admin-enabled=${APP_AUTH_OTP_SUPER_ADMIN_ENABLED:true}
app.auth.otp.dev-bypass-enabled=${APP_AUTH_OTP_DEV_BYPASS_ENABLED:false}
app.auth.otp.dev-expose-value=${APP_AUTH_OTP_DEV_EXPOSE_VALUE:false}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

app.mail.from=${SMTP_FROM:}
app.public-url=${APP_PUBLIC_URL:http://localhost:3002}
