spring.datasource.url=jdbc:h2:mem:fitouts;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.session.jdbc.initialize-schema=always

app.auth.allowed-origins=http://localhost:3000
app.auth.cookie-secure=false
app.auth.otp.dev-expose-value=true
app.auth.otp.dev-bypass-enabled=false
